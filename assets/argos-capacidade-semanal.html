<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Argos Patologia · Capacidade de leitura semanal</title>
<style>
  :root{
    /* cores da marca */
    --marinho:#01133F;
    --marinho-2:#0B2456;
    --marinho-3:#3D5279;
    --ciano:#41C0EB;
    --ciano-forte:#1789B4;
    --ciano-100:#DDF1FB;
    --ciano-50:#F0F8FD;
    --papel:#F4F8FC;
    --branco:#FFFFFF;
    --linha:#D2E2EE;
    --r:8px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--papel);
    color:var(--marinho);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1200px;margin:0 auto;padding:22px 20px 70px}

  header.top{display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between;
    border-bottom:3px solid var(--ciano);padding-bottom:14px;margin-bottom:22px}
  .brand{display:flex;align-items:center;gap:16px}
  .logo{height:44px;width:auto;display:block}
  .brand .risco{width:1px;align-self:stretch;background:var(--linha)}
  .brand .txt .eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ciano-forte);font-weight:700}
  .brand .txt h1{margin:1px 0 0;font-size:23px;font-weight:650;letter-spacing:-.015em;color:var(--marinho)}
  .weeknav{display:flex;align-items:center;gap:8px}
  .weeknav .label{font-size:14px;font-weight:600;min-width:196px;text-align:center;color:var(--marinho);font-variant-numeric:tabular-nums}

  button{font:inherit;cursor:pointer;border:1px solid var(--linha);background:var(--branco);color:var(--marinho);
    border-radius:var(--r);padding:7px 12px;transition:border-color .12s,background .12s,color .12s}
  button:hover{border-color:var(--ciano);color:var(--ciano-forte)}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ciano);outline-offset:1px}
  button.primary{background:var(--marinho);border-color:var(--marinho);color:#fff}
  button.primary:hover{background:var(--marinho-2);color:#fff}
  button.small{padding:5px 9px;font-size:12.5px}
  button.ghost{background:transparent}

  .aviso{border:1px solid #E4CFA6;background:#FCF6E8;color:#6A5215;font-size:13px;padding:9px 12px;border-radius:var(--r);margin-bottom:16px}
  .aviso.hidden{display:none}

  section{margin-bottom:26px}
  .sechead{display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;justify-content:space-between;margin-bottom:10px}
  .sechead h2{margin:0;font-size:16px;font-weight:650;color:var(--marinho);letter-spacing:-.01em}
  .sechead h2 .n{display:inline-flex;align-items:center;justify-content:center;width:21px;height:21px;border-radius:50%;
    background:var(--ciano);color:var(--marinho);font-size:12px;font-weight:700;margin-right:8px;vertical-align:1px}
  .sechead p{margin:0;font-size:13px;color:var(--marinho-3)}

  .painel{background:var(--branco);border:1px solid var(--linha);border-radius:var(--r);padding:16px}
  .quem{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
  select,input[type=text],input[type=number]{font:inherit;border:1px solid var(--linha);border-radius:6px;
    padding:7px 9px;background:var(--branco);color:var(--marinho)}
  select#quem{min-width:290px;font-size:15px;font-weight:600}
  .dias{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
  .dia{border:1px solid var(--linha);border-radius:var(--r);padding:10px;background:var(--ciano-50);display:flex;flex-direction:column;gap:7px}
  .dia.hoje{border-color:var(--ciano);box-shadow:inset 0 3px 0 var(--ciano)}
  .dia h3{margin:0;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ciano-forte);font-weight:700;
    display:flex;justify-content:space-between;align-items:baseline}
  .dia h3 span{font-size:12px;letter-spacing:0;text-transform:none;color:var(--marinho-3);font-weight:500}
  .dia label{font-size:11px;color:var(--marinho-3)}
  .dia input.casos{width:100%;text-align:center;font-size:24px;font-weight:650;padding:6px;color:var(--marinho)}
  .dia input.obs{width:100%;font-size:12.5px}
  .acoes{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
  .salvo{font-size:12.5px;color:var(--ciano-forte);font-weight:600;opacity:0;transition:opacity .2s}
  .salvo.on{opacity:1}
  .salvo.erro{color:#B4442E}
  .semnome{padding:26px;text-align:center;color:var(--marinho-3);border:1px dashed var(--linha);border-radius:var(--r);background:var(--ciano-50)}

  .tabwrap{overflow-x:auto;border-radius:var(--r);border:1px solid var(--linha);background:var(--branco)}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  th,td{border-bottom:1px solid var(--linha);border-right:1px solid var(--linha);padding:0;text-align:center;vertical-align:top}
  th:last-child,td:last-child{border-right:none}
  thead th{background:var(--marinho);color:#fff;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding:10px 6px}
  thead th .d{display:block;font-size:12.5px;letter-spacing:0;text-transform:none;font-weight:500;color:var(--ciano)}
  thead th.hoje{background:var(--ciano);color:var(--marinho)}
  thead th.hoje .d{color:var(--marinho-2)}
  th.nome,td.nome{text-align:left;padding:9px 12px;min-width:230px;position:sticky;left:0;z-index:2;background:var(--branco)}
  thead th.nome{background:var(--marinho)}
  td.nome{font-weight:600;font-size:14px}
  tbody tr:nth-child(even) td,tbody tr:nth-child(even) td.nome{background:#F9FCFE}
  tbody tr.eu td,tbody tr.eu td.nome{background:var(--ciano-50)}
  tbody tr.eu td.nome{box-shadow:inset 3px 0 0 var(--ciano)}
  .cel{padding:8px 6px;min-height:52px;display:flex;flex-direction:column;gap:3px;align-items:center;justify-content:center}
  .cel .n{font-size:19px;font-weight:650;color:var(--marinho)}
  .cel .n.vazio{color:var(--linha);font-weight:400}
  .cel .o{font-size:11.5px;color:var(--marinho-3);line-height:1.25;word-break:break-word}
  tfoot td,tfoot td.nome{background:var(--ciano-100);font-weight:700}
  tfoot td.nome{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--marinho)}
  tfoot .n{font-size:20px;color:var(--marinho);padding:11px 6px;display:block}
  .semdecl{font-size:12.5px;color:var(--marinho-3);margin-top:10px;line-height:1.5}
  .semdecl b{color:var(--marinho)}

  .tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .tools .sep{width:1px;height:22px;background:var(--linha)}
  .linkPlanilha{font-size:12.5px;color:var(--ciano-forte);text-decoration:none;font-weight:600;padding:5px 4px}
  .linkPlanilha:hover{text-decoration:underline}
  dialog{border:1px solid var(--linha);border-radius:var(--r);padding:20px;max-width:540px;width:92%}
  dialog h3{margin:0 0 10px;font-size:17px;color:var(--marinho)}
  dialog textarea{width:100%;height:150px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;border:1px solid var(--linha);border-radius:6px;padding:8px}

  @media (max-width:900px){ .dias{grid-template-columns:repeat(2,1fr)} .brand .risco{display:none} }
  @media print{
    body{background:#fff}
    .painel,.tools,.aviso,.weeknav button,.sechead p{display:none}
    section.preencher{display:none}
    .wrap{max-width:none;padding:0}
    thead th{background:#01133F !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    tfoot td{background:#DDF1FB !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
/* ============================================================
   CONEXÃO COM A PLANILHA (Google Apps Script)
   Cole abaixo a URL /exec da implantação do App da Web.
   Vazio = modo local, os dados ficam só neste navegador.
   ============================================================ */
const API_URL = 'https://script.google.com/macros/s/AKfycbybvjHlSfRqYFOqXjZDa_huOfWrpgwNeIOMIEXA2YaxG3rczw8scWcX5kcMRlqBvTaovA/exec';

// opcional: URL da planilha, para o botao "Abrir planilha" (deixe vazio para esconder)
const PLANILHA_URL = 'https://docs.google.com/spreadsheets/d/16JA1k3NcI8PSUTjqnmLMTfQkG2NCiaPnp4OiDHjWg1Y/edit';

const MODO_LOCAL = !API_URL;
const CHAVE_LOCAL = 'argos_capacidade_local_v3';

async function apiGet(){
  if(MODO_LOCAL) return localLer();
  const r = await fetch(API_URL + '?t=' + Date.now(), { method:'GET' });
  if(!r.ok) throw new Error('HTTP ' + r.status);
  return await r.json();
}

async function apiPost(payload){
  if(MODO_LOCAL) return localGravar(payload);
  // text/plain evita o preflight CORS que o Apps Script não responde
  const r = await fetch(API_URL, {
    method:'POST',
    headers:{ 'Content-Type':'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });
  if(!r.ok) throw new Error('HTTP ' + r.status);
  const j = await r.json();
  if(j && j.ok === false) throw new Error(j.erro || 'erro no servidor');
  return j;
}

/* modo local: mesma lógica do backend, em localStorage */
function localLer(){
  let d = null;
  try{ d = JSON.parse(localStorage.getItem(CHAVE_LOCAL) || 'null'); }catch(e){}
  if(!d) d = { ok:true, equipe: EQUIPE.slice().sort((a,b)=>a.localeCompare(b,'pt-BR')), reg:{} };
  if(!d.equipe || !d.equipe.length) d.equipe = EQUIPE.slice().sort((a,b)=>a.localeCompare(b,'pt-BR'));
  if(!d.reg) d.reg = {};
  return d;
}
function localGravar(p){
  const d = localLer();
  const um = it=>{
    const k = it.nome+'|'+it.semana+'|'+it.dia;
    const cur = d.reg[k] || { casos:null, obs:'' };
    if(it.campo === 'obs') cur.obs = it.valor || '';
    else cur.casos = (it.valor === '' || it.valor === null) ? null : Number(it.valor);
    if(cur.casos === null && !cur.obs) delete d.reg[k]; else d.reg[k] = cur;
  };
  if(p.acao === 'salvar') um(p);
  if(p.acao === 'salvarLote') (p.itens||[]).forEach(um);
  if(p.acao === 'limpar') for(let i=0;i<6;i++) delete d.reg[p.nome+'|'+p.semana+'|'+i];
  if(p.acao === 'addNome' && p.nome && !d.equipe.some(n=>n.toLowerCase()===p.nome.toLowerCase())){
    d.equipe.push(p.nome); d.equipe.sort((a,b)=>a.localeCompare(b,'pt-BR'));
  }
  localStorage.setItem(CHAVE_LOCAL, JSON.stringify(d));
  return d;
}

  'Marcella Melo Aguiar',
  'Matheus Camelo Ferreira',
  'Mônica Modesto Araujo e Porfírio',
  'Priscilla Mariana Freitas Aguiar Feitosa',
  'Ruana Rocha'
];

const DIAS = ['Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const DIAS_C = ['Seg','Ter','Qua','Qui','Sex','Sáb'];
const MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

let estado = { equipe:[], reg:{} };
let eu = '';
let semana = segundaDe(new Date());
let editando = false;

function segundaDe(d){
  // domingo: mostra a semana que comeca no dia seguinte, nao a que ja terminou
  if(d.getDay()===0) return new Date(d.getFullYear(),d.getMonth(),d.getDate()+1);
  const o=(d.getDay()+6)%7;
  return new Date(d.getFullYear(),d.getMonth(),d.getDate()-o);
}
function maisDias(d,n){ return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n); }
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function sem(){ return iso(semana); }
function chave(nome,s,dia){ return nome+'|'+s+'|'+dia; }
function reg(nome,dia,s){ return estado.reg[chave(nome,s||sem(),dia)] || null; }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

let salvando = 0;

/* aplica a mudança na tela na hora e manda para a planilha em seguida */
async function enviar(payload, mutacaoLocal){
  if(mutacaoLocal) mutacaoLocal(estado);
  desenhar();
  status('salvando');
  salvando++;
  try{
    const r = await apiPost(payload);
    if(r && r.reg){ estado = r; desenhar(); }
    status('salvo');
  }catch(e){
    console.error(e);
    status('erro');
  }finally{ salvando--; }
}

function status(tipo){
  const s = document.getElementById('salvo');
  if(!s) return;
  s.classList.remove('erro');
  if(tipo === 'salvando'){ s.textContent = 'salvando…'; s.classList.add('on'); return; }
  if(tipo === 'erro'){
    s.textContent = 'não salvou, verifique a conexão';
    s.classList.add('on','erro');
    return;
  }
  s.textContent = 'Salvo';
  s.classList.add('on');
  setTimeout(()=>{ if(!salvando) s.classList.remove('on'); }, 1800);
}

async function sincronizar(){
  if(editando || salvando) return;
  try{
    const r = await apiGet();
    if(r && r.reg && JSON.stringify(r.reg) !== JSON.stringify(estado.reg)){ estado = r; desenhar(); }
  }catch(e){ /* silencioso: a próxima rodada tenta de novo */ }
}

/* ============================================================
   DESENHO
   ============================================================ */
function periodo(){
  const a = semana, b = maisDias(semana,5);
  return a.getDate()+' '+MESES[a.getMonth()]+' – '+b.getDate()+' '+MESES[b.getMonth()]+' '+b.getFullYear();
}

function desenhar(){
  document.getElementById('weekLabel').textContent = periodo();

  const av = document.getElementById('aviso');
  if(MODO_LOCAL){ av.classList.remove('hidden');
    av.textContent = 'Modo local: a planilha ainda não está conectada, então os dados ficam apenas neste navegador e não são vistos pelos colegas.'; }
  else av.classList.add('hidden');

  const sel = document.getElementById('quem');
  sel.innerHTML = '<option value="">Selecione seu nome…</option>' +
    estado.equipe.map(n=>`<option value="${esc(n)}"${n===eu?' selected':''}>${esc(n)}</option>`).join('');

  desenharForm();
  desenharGrade();
}

function desenharForm(){
  const area = document.getElementById('formArea');
  if(!eu){ area.innerHTML = '<div class="semnome">Selecione seu nome acima para liberar o preenchimento.</div>'; return; }
  const hojeIso = iso(new Date());
  let h = '<div class="dias">';
  for(let d=0; d<6; d++){
    const data = maisDias(semana,d);
    const e = reg(eu,d) || {};
    const ehHoje = iso(data)===hojeIso;
    h += `<div class="dia ${ehHoje?'hoje':''}">
      <h3>${DIAS_C[d]}<span>${data.getDate()}/${String(data.getMonth()+1).padStart(2,'0')}</span></h3>
      <label for="c${d}">Casos que quero receber</label>
      <input class="casos" id="c${d}" type="number" min="0" max="99" data-d="${d}" data-f="casos"
             value="${e.casos==null?'':e.casos}" placeholder="–" aria-label="Casos ${DIAS[d]}">
      <label for="o${d}">Anotações</label>
      <input class="obs" id="o${d}" type="text" maxlength="80" data-d="${d}" data-f="obs"
             value="${esc(e.obs||'')}" placeholder="opcional" aria-label="Anotações ${DIAS[d]}">
    </div>`;
  }
  h += '</div>';
  h += `<div class="acoes">
      <button id="copiar" class="small">Copiar semana anterior</button>
      <button id="limpar" class="small ghost">Limpar minha semana</button>
      <span class="salvo" id="salvo">Salvo</span>
    </div>`;
  area.innerHTML = h;

  document.getElementById('copiar').onclick = copiarAnterior;
  document.getElementById('limpar').onclick = limparMinha;
}

function desenharGrade(){
  const tab = document.getElementById('grade');
  const hojeIso = iso(new Date());

  let cab = '<thead><tr><th class="nome">Patologista</th>';
  for(let d=0; d<6; d++){
    const data = maisDias(semana,d);
    cab += `<th class="${iso(data)===hojeIso?'hoje':''}">${DIAS_C[d]}<span class="d">${data.getDate()}/${String(data.getMonth()+1).padStart(2,'0')}</span></th>`;
  }
  cab += '<th>Semana</th></tr></thead>';

  const comDados = estado.equipe.filter(n=>{
    for(let d=0; d<6; d++){ const e = reg(n,d); if(e && (e.casos!=null || e.obs)) return true; }
    return false;
  });
  const semDados = estado.equipe.filter(n=>!comDados.includes(n));

  let corpo = '<tbody>';
  if(comDados.length===0){
    corpo += `<tr><td class="nome" colspan="8" style="text-align:center;color:var(--marinho-3);padding:26px">Ninguém declarou capacidade nesta semana ainda.</td></tr>`;
  }
  for(const n of comDados){
    let tot = 0;
    corpo += `<tr class="${n===eu?'eu':''}"><td class="nome">${esc(n)}</td>`;
    for(let d=0; d<6; d++){
      const e = reg(n,d) || {};
      if(e.casos) tot += e.casos;
      corpo += `<td><div class="cel">
        <span class="n ${e.casos==null?'vazio':''}">${e.casos==null?'–':e.casos}</span>
        ${e.obs?`<span class="o">${esc(e.obs)}</span>`:''}
      </div></td>`;
    }
    corpo += `<td><div class="cel"><span class="n">${tot||'–'}</span></div></td></tr>`;
  }
  corpo += '</tbody>';

  let tot = [];
  for(let d=0; d<6; d++){ let s=0; estado.equipe.forEach(n=>{ const e=reg(n,d); if(e&&e.casos) s+=e.casos; }); tot.push(s); }
  let rod = '<tfoot><tr><td class="nome">Total do dia</td>';
  for(let d=0; d<6; d++) rod += `<td><span class="n">${tot[d]||'–'}</span></td>`;
  rod += `<td><span class="n">${tot.reduce((a,b)=>a+b,0)||'–'}</span></td></tr></tfoot>`;

  tab.innerHTML = cab + corpo + rod;

  const sd = document.getElementById('semdecl');
  sd.innerHTML = semDados.length
    ? '<b>Ainda sem declaração ('+semDados.length+'):</b> '+semDados.map(esc).join(' · ')
    : '';
}

/* ============================================================
   EVENTOS
   ============================================================ */
document.getElementById('formArea').addEventListener('focusin', e=>{ if(e.target.matches('input')) editando = true; });
document.getElementById('formArea').addEventListener('focusout', ()=>{ setTimeout(()=>{ editando=false; }, 300); });

document.getElementById('formArea').addEventListener('change', async e=>{
  const t = e.target;
  if(!t.matches('input') || !eu) return;
  const d = +t.dataset.d, f = t.dataset.f, s = sem();
  const bruto = t.value.trim();
  const valor = f==='casos'
    ? (bruto==='' ? null : Math.max(0, Math.min(99, parseInt(bruto,10)||0)))
    : bruto;
  await enviar(
    { acao:'salvar', semana:s, nome:eu, dia:d, campo:f, valor:valor },
    st=>{
      const k = chave(eu,s,d);
      const cur = st.reg[k] || { casos:null, obs:'' };
      if(f==='casos') cur.casos = valor;
      if(f==='obs') cur.obs = valor;
      if(cur.casos==null && !cur.obs) delete st.reg[k]; else st.reg[k] = cur;
    }
  );
});

async function copiarAnterior(){
  const ant = iso(maisDias(semana,-7)), s = sem();
  const itens = [];
  for(let d=0; d<6; d++){
    const src = estado.reg[chave(eu,ant,d)];
    const atual = estado.reg[chave(eu,s,d)];
    if(!src || src.casos==null) continue;
    if(atual && atual.casos!=null) continue;
    itens.push({ semana:s, nome:eu, dia:d, campo:'casos', valor:src.casos });
  }
  if(!itens.length){ alert('Nada para copiar da semana anterior.'); return; }
  await enviar({ acao:'salvarLote', itens:itens }, st=>{
    itens.forEach(it=>{
      const k = chave(eu,s,it.dia);
      const cur = st.reg[k] || { casos:null, obs:'' };
      cur.casos = it.valor; st.reg[k] = cur;
    });
  });
}

async function limparMinha(){
  if(!confirm('Apagar seus números e anotações desta semana?')) return;
  const s = sem();
  await enviar({ acao:'limpar', semana:s, nome:eu }, st=>{
    for(let d=0; d<6; d++) delete st.reg[chave(eu,s,d)];
  });
}

document.getElementById('quem').addEventListener('change', e=>{ eu = e.target.value; desenhar(); });
document.getElementById('addNome').addEventListener('click', async ()=>{
  const inp = document.getElementById('novoNome');
  const nome = inp.value.trim();
  if(!nome) return;
  if(estado.equipe.some(n=>n.toLowerCase()===nome.toLowerCase())){ alert('Esse nome já está na lista.'); return; }
  inp.value='';
  eu = nome;
  await enviar({ acao:'addNome', nome:nome }, st=>{
    st.equipe.push(nome); st.equipe.sort((a,b)=>a.localeCompare(b,'pt-BR'));
  });
});

document.getElementById('prev').onclick = ()=>{ semana = maisDias(semana,-7); desenhar(); };
document.getElementById('next').onclick = ()=>{ semana = maisDias(semana,7); desenhar(); };
document.getElementById('hoje').onclick = ()=>{ semana = segundaDe(new Date()); desenhar(); };
document.getElementById('atualizar').onclick = async ()=>{
  try{ const r = await apiGet(); if(r && r.reg){ estado = r; desenhar(); } }
  catch(e){ alert('Não foi possível ler a planilha agora.'); }
};
document.getElementById('imprimir').onclick = ()=>window.print();

document.getElementById('csv').onclick = ()=>{
  const linhas = [['Semana de '+sem()],[],['Patologista', ...DIAS, 'Total']];
  for(const n of estado.equipe){
    const l = [n]; let t=0;
    for(let d=0; d<6; d++){ const e = reg(n,d)||{}; l.push(e.casos==null?'':e.casos); t += e.casos||0; }
    l.push(t); linhas.push(l);
  }
  const tot = ['Total do dia']; let g=0;
  for(let d=0; d<6; d++){ let s=0; estado.equipe.forEach(n=>{ const e=reg(n,d); if(e&&e.casos) s+=e.casos; }); tot.push(s); g+=s; }
  tot.push(g); linhas.push(tot);
  linhas.push([],['Anotações']);
  for(const n of estado.equipe) for(let d=0; d<6; d++){
    const e = reg(n,d); if(e && e.obs) linhas.push([n, DIAS[d], e.obs]);
  }
  const csv = '\uFEFF' + linhas.map(r=>r.join(';')).join('\n');
  const b = new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = 'argos-capacidade-'+sem()+'.csv'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
};

/* ============================================================
   INÍCIO
   ============================================================ */
(async function(){
  try{
    const r = await apiGet();
    if(r && r.reg) estado = r;
  }catch(e){
    console.error(e);
    const av = document.getElementById('aviso');
    av.classList.remove('hidden');
    av.textContent = 'Não foi possível conectar à planilha. Verifique a conexão e recarregue a página.';
  }
  if(!estado.equipe || !estado.equipe.length) estado.equipe = EQUIPE.slice().sort((a,b)=>a.localeCompare(b,'pt-BR'));
  if(!estado.reg) estado.reg = {};
  if(PLANILHA_URL){
    const a = document.getElementById('planilha');
    a.href = PLANILHA_URL; a.style.display = 'inline';
  }
  desenhar();
  setInterval(sincronizar, 20000);
})();
</script>
